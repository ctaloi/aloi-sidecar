<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aloi Sidecar</title>
<style>
  :root { --bg:#111317; --panel:#1a1d23; --line:#2c313a; --text:#e6e8ec; --dim:#8b929e; --me:#4fa3ff; --them:#4fd18b; --accent:#ffb347; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column; }
  header { padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; }
  .meters { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
  .meter { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
  .bar { width: 60px; height: 6px; background: #0b0c0f; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--them); transition: width .1s; }
  .meter.me .bar i { background: var(--me); }
  .meter.dead { opacity: .4; }
  .meter.speaking { color: var(--text); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  #transcript { overflow-y: auto; padding: 14px 18px; border-right: 1px solid var(--line); }
  .seg { margin: 0 0 8px; display: grid; grid-template-columns: 58px 54px 1fr; gap: 8px; }
  .seg .t { color: var(--dim); font: 11px/1.9 ui-monospace, monospace; }
  .seg .who { font-weight: 650; font-size: 12px; line-height: 1.75; }
  .seg.me .who { color: var(--me); } .seg.them .who { color: var(--them); }
  .seg.interim { opacity: .5; font-style: italic; }
  .empty { color: var(--dim); padding: 30px 0; text-align: center; }
  aside { display: flex; flex-direction: column; min-height: 0; }
  #answers { flex: 1; overflow-y: auto; padding: 14px 18px; }
  .qa { margin-bottom: 18px; }
  .qa .q { color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .qa .a { white-space: pre-wrap; }
  .qa .u { color: var(--dim); font-size: 11px; margin-top: 4px; }
  .qa .err { color: #ff8080; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  input { flex: 1; background: #0b0c0f; border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 10px 12px; font: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: #1a1205; border: 0; border-radius: 8px; padding: 0 16px; font: inherit; font-weight: 650; cursor: pointer; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; }
  .chip { background: #23272f; border: 1px solid var(--line); color: var(--dim); border-radius: 99px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .chip:hover { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>Aloi Sidecar</h1>
  <span id="status" style="color:var(--dim);font-size:12px">connecting…</span>
  <button id="listen" style="padding:4px 12px">…</button>
  <div class="meters" id="meters"></div>
</header>
<main>
  <section id="transcript"><div class="empty" id="empty">Listening… speak, or start your call.</div></section>
  <aside>
    <div id="answers"></div>
    <div class="chips">
      <span class="chip">What did I miss in the last 5 minutes?</span>
      <span class="chip">Summarize so far</span>
      <span class="chip">What action items have come up?</span>
      <span class="chip">Has anyone asked me something I haven't answered?</span>
    </div>
    <form id="ask"><input id="q" placeholder="Ask about the call…" autocomplete="off"><button>Ask</button></form>
  </aside>
</main>
<script>
const tx = document.getElementById("transcript"), interims = {};
function nearBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 80; }
function segEl(cls, time, who, text) {
  const d = document.createElement("div");
  d.className = "seg " + cls;
  d.innerHTML = `<span class="t"></span><span class="who"></span><span class="x"></span>`;
  d.children[0].textContent = time; d.children[1].textContent = who; d.children[2].textContent = text;
  return d;
}
function addSegment(m) {
  document.getElementById("empty")?.remove();
  const stick = nearBottom(tx);
  const el = segEl(m.speaker === "Them" ? "them" : "me", m.time, m.speaker === "Them" ? "Them" : "Me", m.text);
  const firstInterim = tx.querySelector(".interim");
  tx.insertBefore(el, firstInterim);
  if (stick) tx.scrollTop = tx.scrollHeight;
}
function setInterim(m) {
  let el = interims[m.label];
  if (!m.text) { el?.remove(); delete interims[m.label]; return; }
  document.getElementById("empty")?.remove();
  const stick = nearBottom(tx);
  if (!el) { el = segEl((m.speaker === "Them" ? "them" : "me") + " interim", "…", m.speaker === "Them" ? "Them" : "Me", ""); tx.appendChild(el); interims[m.label] = el; }
  el.children[2].textContent = m.text;
  if (stick) tx.scrollTop = tx.scrollHeight;
}
function setLevels(chs) {
  const box = document.getElementById("meters");
  box.innerHTML = chs.map(c => `<span class="meter ${c.speaker === "Them" ? "" : "me"} ${c.alive ? "" : "dead"} ${c.speaking ? "speaking" : ""}">${c.label}<span class="bar"><i style="width:${Math.min(100, Math.sqrt(c.level) * 300)}%"></i></span></span>`).join("");
}
let listening = false, current = null;
document.getElementById("listen").onclick = () => fetch("/listen", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on: !listening }) });
const es = new EventSource("/events");
es.onopen = () => document.getElementById("status").textContent = "live";
es.onerror = () => document.getElementById("status").textContent = "disconnected";
es.onmessage = e => {
  const m = JSON.parse(e.data);
  if (m.type === "state") {
    if (m.current !== current) { tx.innerHTML = ""; for (const k in interims) delete interims[k]; current = m.current; }
    listening = m.listening; document.getElementById("listen").textContent = listening ? "Pause" : "Listen";
  }
  else if (m.type === "segment") { if (m.meeting === current) addSegment(m); }
  else if (m.type === "interim") setInterim(m);
  else if (m.type === "levels") setLevels(m.channels);
};

const answers = document.getElementById("answers");
async function ask(q) {
  const box = document.createElement("div"); box.className = "qa";
  box.innerHTML = `<div class="q"></div><div class="a">…</div><div class="u"></div>`;
  box.children[0].textContent = q; answers.appendChild(box); answers.scrollTop = answers.scrollHeight;
  const a = box.children[1]; let first = true;
  const res = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ q }) });
  const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n")) >= 0) {
      const m = JSON.parse(buf.slice(0, i)); buf = buf.slice(i + 1);
      if (m.type === "answer_delta") { if (first) { a.textContent = ""; first = false; } a.textContent += m.text; }
      else if (m.type === "error") { a.innerHTML = ""; a.className = "a err"; a.textContent = m.text; }
      else if (m.type === "answer_done") box.children[2].textContent = `${m.usage.input + m.usage.cache_read + m.usage.cache_write} in (${m.usage.cache_read} cached) · ${m.usage.output} out`;
      answers.scrollTop = answers.scrollHeight;
    }
  }
}
document.getElementById("ask").onsubmit = e => { e.preventDefault(); const q = document.getElementById("q"); if (q.value.trim()) { ask(q.value.trim()); q.value = ""; } };
document.querySelectorAll(".chip").forEach(c => c.onclick = () => ask(c.textContent));
</script>
</body>
</html>
